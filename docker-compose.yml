services:
  mysql:
    image: mysql:8.4
    restart: on-failure
    container_name: ${DOCKER_CONTAINER}

    env_file:
      - .env

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "${HOST_PORT}:${CONTAINER_PORT}"

    volumes:
      - ./:/bootcamp/
      - ./mysql-data.sql:/docker-entrypoint-initdb.d/01-data.sql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/02-init-db.sh
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: